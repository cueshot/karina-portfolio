<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='24' font-family='Georgia%2C serif' font-size='22' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/gallery.css">
  <script src="js/main.js"></script>
</head>
<body class="page-gallery">

  <!-- Watermark -->
  <div class="watermark watermark-left">THIS IS A DEMO</div>
  <div class="watermark watermark-right">THIS IS A DEMO</div>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="nav-logo">Karina</a>
    <button class="nav-toggle" aria-label="Toggle menu" id="navToggle">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html">Home</a></li>
      <li><a href="gallery.html" class="active">Gallery</a></li>
      <li><a href="about.html">About</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <p class="section-label reveal">Portfolio</p>
    <h1 class="reveal">Gallery</h1>
    <p class="tagline reveal">Moments Preserved in Time</p>
    <div class="header-rule reveal"></div>
  </header>

  <!-- Masonry -->
  <main class="masonry-wrap">
    <div class="masonry-grid" id="masonryGrid"></div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">

    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6"  y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="lb-img-wrap">
      <img class="lb-img" id="lbImg" src="" alt="">
    </div>

    <button class="lb-arrow lb-next" id="lbNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="lb-counter" id="lbCounter">1 / 12</div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer-name">Karina</span>
    <p>hello@karinaphoto.com &nbsp;&middot;&nbsp; New York, NY</p>
    <p>&copy; 2026 Karina Photography</p>
  </footer>


  <button class="scroll-top" id="scrollTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>


</body>
</html>
