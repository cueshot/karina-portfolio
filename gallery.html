<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery — Karina</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23000'/%3E%3Ctext x='16' y='24' font-family='Georgia%2C serif' font-size='22' fill='%23fff' text-anchor='middle'%3EK%3C/text%3E%3C/svg%3E">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;1,9..40,300&family=Pinyon+Script&family=Viaoda+Libre&display=swap" rel="stylesheet">

  <style>
    /* ── Reset ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html { scroll-behavior: smooth; }

    body {
      background-color: #000000;
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      overflow-x: hidden;
    }

    /* ── Navigation ── */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 200;
      padding: 28px 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .nav-logo {
      font-family: 'Viaoda Libre', serif;
      font-size: 1.35rem;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.06em;
    }

    .nav-links {
      list-style: none;
      display: flex;
      gap: 44px;
    }

    .nav-links a {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.78rem;
      font-weight: 300;
      color: #ffffff;
      text-decoration: none;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: opacity 0.2s;
    }

    .nav-links a:hover     { opacity: 0.5; }
    .nav-links a.active    { opacity: 0.4; border-bottom: 1px solid rgba(255,255,255,0.45); padding-bottom: 3px; pointer-events: none; }

    /* hamburger */
    .nav-toggle {
      display: none;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      z-index: 300;
    }

    .nav-toggle span {
      display: block;
      width: 22px;
      height: 1px;
      background: #ffffff;
      transition: transform 0.3s, opacity 0.3s;
    }

    .nav-toggle.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
    .nav-toggle.open span:nth-child(2) { opacity: 0; }
    .nav-toggle.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

    /* ── Page Header ── */
    .page-header {
      padding: 160px 56px 76px;
      text-align: center;
    }

    .section-label {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.68rem;
      font-weight: 300;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.38);
      margin-bottom: 26px;
    }

    .page-header h1 {
      font-family: 'Viaoda Libre', serif;
      font-size: clamp(3.2rem, 8vw, 6rem);
      font-weight: 400;
      line-height: 1;
      margin-bottom: 22px;
    }

    .page-header .tagline {
      font-family: 'Pinyon Script', cursive;
      font-style: italic;
      font-size: clamp(1.5rem, 3.2vw, 2.4rem);
      color: rgba(255,255,255,0.65);
    }

    .header-rule {
      width: 1px;
      height: 56px;
      background: rgba(255,255,255,0.15);
      margin: 52px auto 0;
    }

    /* ── Masonry Grid ── */
    .masonry-wrap {
      padding: 64px 48px 130px;
      max-width: 1340px;
      margin: 0 auto;
    }

    .masonry-grid {
      columns: 3;
      column-gap: 14px;
    }

    .masonry-item {
      break-inside: avoid;
      margin-bottom: 14px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      display: block;
    }

    .masonry-item img {
      width: 100%;
      display: block;
      filter: grayscale(100%);
      transition: transform 0.65s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }

    .masonry-item:hover img { transform: scale(1.05); }

    .masonry-item-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.4s ease;
    }

    .masonry-item:hover .masonry-item-overlay { background: rgba(0,0,0,0.32); }

    .expand-icon {
      opacity: 0;
      transform: scale(0.8);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .masonry-item:hover .expand-icon {
      opacity: 0.9;
      transform: scale(1);
    }

    /* ── Lightbox ── */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.4s ease;
    }

    .lightbox.open {
      opacity: 1;
      visibility: visible;
      background: rgba(0,0,0,0.96);
    }

    /* close button */
    .lb-close {
      position: absolute;
      top: 24px;
      right: 32px;
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 10px;
      opacity: 0.55;
      transition: opacity 0.2s;
      line-height: 1;
      z-index: 10;
    }

    .lb-close:hover { opacity: 1; }

    .lb-close svg { width: 22px; height: 22px; }

    /* arrows */
    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      padding: 20px 28px;
      opacity: 0.4;
      transition: opacity 0.2s;
      z-index: 10;
      line-height: 1;
    }

    .lb-arrow:hover  { opacity: 1; }
    .lb-arrow svg    { width: 28px; height: 28px; display: block; }
    .lb-prev         { left: 0; }
    .lb-next         { right: 0; }

    /* image */
    .lb-img-wrap {
      max-width: calc(100vw - 160px);
      max-height: 90vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lb-img {
      max-width: 100%;
      max-height: 90vh;
      object-fit: contain;
      filter: grayscale(100%);
      display: block;
      opacity: 0;
      transform: scale(0.96);
      transition: opacity 0.32s ease, transform 0.32s ease;
    }

    .lb-img.lb-visible {
      opacity: 1;
      transform: scale(1);
    }

    /* counter */
    .lb-counter {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.7rem;
      font-weight: 300;
      letter-spacing: 0.22em;
      color: rgba(255,255,255,0.35);
      white-space: nowrap;
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid rgba(255,255,255,0.09);
      padding: 40px 56px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }

    .footer-name {
      font-family: 'Viaoda Libre', serif;
      font-size: 1.25rem;
      color: rgba(255,255,255,0.55);
    }

    footer p {
      font-family: 'DM Sans', sans-serif;
      font-size: 0.76rem;
      font-weight: 300;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.06em;
    }

    /* ── Responsive ── */
    @media (max-width: 1024px) {
      .masonry-grid { columns: 3; }
    }

    @media (max-width: 768px) {
      nav { padding: 22px 24px; }

      .nav-toggle { display: flex; }

      .nav-links {
        position: fixed;
        top: 0;
        right: -100%;
        width: 72%;
        max-width: 300px;
        height: 100vh;
        background: #000000;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 48px;
        transition: right 0.4s cubic-bezier(0.77, 0, 0.175, 1);
        border-left: 1px solid rgba(255,255,255,0.07);
      }

      .nav-links.open { right: 0; }
      .nav-links a    { font-size: 0.9rem; letter-spacing: 0.22em; }

      .page-header   { padding: 130px 28px 60px; }
      .masonry-wrap  { padding: 48px 16px 90px; }

      .masonry-grid {
        columns: 2;
        column-gap: 10px;
      }

      .masonry-item { margin-bottom: 10px; }

      .lb-img-wrap  { max-width: calc(100vw - 80px); }
      .lb-arrow     { padding: 16px 16px; }

      footer {
        padding: 36px 28px;
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
    }

    @media (max-width: 480px) {
      .masonry-grid { columns: 1; }
    }

    /* ── Scroll reveal ── */
    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity 0.72s cubic-bezier(0.4, 0, 0.2, 1),
                  transform 0.72s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .reveal.in-view { opacity: 1; transform: none; }

    @media (prefers-reduced-motion: reduce) {
      .reveal { opacity: 1; transform: none; transition: none; }
    }

    /* ── Scroll to top ── */
    .scroll-top {
      position: fixed;
      bottom: 32px;
      right: 32px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.35s ease, background 0.25s ease, transform 0.25s ease;
      z-index: 100;
    }

    .scroll-top svg {
      width: 14px;
      height: 14px;
      stroke: #000000;
      transition: stroke 0.25s ease;
      flex-shrink: 0;
    }

    .scroll-top.visible       { opacity: 1; pointer-events: auto; }
    .scroll-top:hover         { background: #000000; transform: translateY(-3px); }
    .scroll-top:hover svg     { stroke: #ffffff; }
    .scroll-top:focus-visible { outline: 1px solid rgba(255,255,255,0.5); outline-offset: 4px; }
  </style>
</head>
<body>

  <!-- Navigation -->
  <nav>
    <a href="index.html" class="nav-logo">Karina</a>
    <button class="nav-toggle" aria-label="Toggle menu" id="navToggle">
      <span></span><span></span><span></span>
    </button>
    <ul class="nav-links" id="navLinks">
      <li><a href="index.html"      onclick="closeNav()">Home</a></li>
      <li><a href="gallery.html"    onclick="closeNav()" class="active">Gallery</a></li>
      <li><a href="about.html"   onclick="closeNav()">About</a></li>
      <li><a href="contact.html" onclick="closeNav()">Contact</a></li>
    </ul>
  </nav>

  <!-- Page Header -->
  <header class="page-header">
    <p class="section-label">Portfolio</p>
    <h1>Gallery</h1>
    <p class="tagline">Moments Preserved in Time</p>
    <div class="header-rule"></div>
  </header>

  <!-- Masonry -->
  <main class="masonry-wrap">
    <div class="masonry-grid" id="masonryGrid"></div>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo lightbox">

    <button class="lb-close" id="lbClose" aria-label="Close">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
        <line x1="18" y1="6" x2="6" y2="18"/>
        <line x1="6"  y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <button class="lb-arrow lb-prev" id="lbPrev" aria-label="Previous photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </button>

    <div class="lb-img-wrap">
      <img class="lb-img" id="lbImg" src="" alt="">
    </div>

    <button class="lb-arrow lb-next" id="lbNext" aria-label="Next photo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"/>
      </svg>
    </button>

    <div class="lb-counter" id="lbCounter">1 / 12</div>
  </div>

  <!-- Footer -->
  <footer>
    <span class="footer-name">Karina</span>
    <p>hello@karinaphoto.com &nbsp;&middot;&nbsp; New York, NY</p>
    <p>&copy; 2026 Karina Photography</p>
  </footer>

  <script>
    // ─────────────────────────────────────────────────
    // Photo data — picsum.photos with stable seeds
    // thumb: shown in masonry grid
    // full:  shown in lightbox
    // ─────────────────────────────────────────────────
    const photos = [
      { thumb: 'https://picsum.photos/seed/kr01/660/990',  full: 'https://picsum.photos/seed/kr01/1320/1980' },  // 2:3
      { thumb: 'https://picsum.photos/seed/kr02/660/440',  full: 'https://picsum.photos/seed/kr02/1320/880'  },  // 3:2
      { thumb: 'https://picsum.photos/seed/kr03/660/825',  full: 'https://picsum.photos/seed/kr03/1320/1650' },  // 4:5
      { thumb: 'https://picsum.photos/seed/kr04/660/495',  full: 'https://picsum.photos/seed/kr04/1320/990'  },  // 4:3
      { thumb: 'https://picsum.photos/seed/kr05/660/940',  full: 'https://picsum.photos/seed/kr05/1320/1880' },  // tall portrait
      { thumb: 'https://picsum.photos/seed/kr06/660/660',  full: 'https://picsum.photos/seed/kr06/1320/1320' },  // 1:1
      { thumb: 'https://picsum.photos/seed/kr07/660/440',  full: 'https://picsum.photos/seed/kr07/1320/880'  },  // 3:2
      { thumb: 'https://picsum.photos/seed/kr08/660/990',  full: 'https://picsum.photos/seed/kr08/1320/1980' },  // 2:3
      { thumb: 'https://picsum.photos/seed/kr09/660/550',  full: 'https://picsum.photos/seed/kr09/1320/1100' },  // 6:5
      { thumb: 'https://picsum.photos/seed/kr10/660/825',  full: 'https://picsum.photos/seed/kr10/1320/1650' },  // 4:5
      { thumb: 'https://picsum.photos/seed/kr11/660/440',  full: 'https://picsum.photos/seed/kr11/1320/880'  },  // 3:2
      { thumb: 'https://picsum.photos/seed/kr12/660/940',  full: 'https://picsum.photos/seed/kr12/1320/1880' },  // tall portrait
    ];

    // ─────────────────────────────────────────────────
    // Build masonry grid
    // ─────────────────────────────────────────────────
    const grid = document.getElementById('masonryGrid');

    photos.forEach((photo, i) => {
      const item = document.createElement('div');
      item.className = 'masonry-item';
      item.tabIndex = 0;
      item.setAttribute('role', 'button');
      item.setAttribute('aria-label', `Open photo ${i + 1} of ${photos.length}`);

      item.innerHTML = `
        <img src="${photo.thumb}" alt="Wedding photo ${i + 1}" loading="lazy">
        <div class="masonry-item-overlay">
          <svg class="expand-icon" width="44" height="44" viewBox="0 0 44 44"
               fill="none" stroke="white" stroke-width="0.8">
            <circle cx="22" cy="22" r="20"/>
            <line x1="15" y1="22" x2="29" y2="22"/>
            <line x1="22" y1="15" x2="22" y2="29"/>
          </svg>
        </div>`;

      item.addEventListener('click',   () => openLightbox(i));
      item.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openLightbox(i); }
      });

      grid.appendChild(item);
    });

    // ─────────────────────────────────────────────────
    // Lightbox
    // ─────────────────────────────────────────────────
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lbImg');
    const lbCounter = document.getElementById('lbCounter');
    const lbClose   = document.getElementById('lbClose');
    const lbPrev    = document.getElementById('lbPrev');
    const lbNext    = document.getElementById('lbNext');

    let current   = 0;
    let animating = false;

    function openLightbox(index) {
      current = index;
      lbImg.src = photos[index].full;
      lbImg.alt = `Wedding photo ${index + 1}`;
      updateCounter();
      lightbox.classList.add('open');
      document.body.style.overflow = 'hidden';
      // allow paint, then fade image in
      requestAnimationFrame(() => requestAnimationFrame(() => lbImg.classList.add('lb-visible')));
      lbClose.focus();
    }

    function closeLightbox() {
      lbImg.classList.remove('lb-visible');
      lightbox.classList.remove('open');
      document.body.style.overflow = '';
    }

    function navigate(dir) {
      if (animating) return;
      animating = true;

      lbImg.classList.remove('lb-visible');

      setTimeout(() => {
        current = (current + dir + photos.length) % photos.length;
        lbImg.src = photos[current].full;
        lbImg.alt = `Wedding photo ${current + 1}`;
        updateCounter();
        requestAnimationFrame(() => requestAnimationFrame(() => {
          lbImg.classList.add('lb-visible');
          animating = false;
        }));
      }, 260);
    }

    function updateCounter() {
      lbCounter.textContent = `${current + 1} / ${photos.length}`;
    }

    lbClose.addEventListener('click', closeLightbox);
    lbPrev.addEventListener('click',  () => navigate(-1));
    lbNext.addEventListener('click',  () => navigate(1));

    // click backdrop to close
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLightbox();
    });

    // keyboard navigation
    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('open')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  navigate(-1);
      if (e.key === 'ArrowRight') navigate(1);
    });

    // touch / swipe support
    let touchX = 0;
    lightbox.addEventListener('touchstart', (e) => { touchX = e.changedTouches[0].clientX; }, { passive: true });
    lightbox.addEventListener('touchend',   (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (Math.abs(dx) > 48) navigate(dx < 0 ? 1 : -1);
    });

    // ─────────────────────────────────────────────────
    // Mobile nav
    // ─────────────────────────────────────────────────
    const navToggle = document.getElementById('navToggle');
    const navLinks  = document.getElementById('navLinks');

    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      navToggle.classList.toggle('open');
    });

    function closeNav() {
      navLinks.classList.remove('open');
      navToggle.classList.remove('open');
    }

    document.addEventListener('click', (e) => {
      if (navLinks.classList.contains('open') &&
          !navLinks.contains(e.target) &&
          !navToggle.contains(e.target)) closeNav();
    });

    // ── Scroll reveal ──
    (function () {
      const els = [...document.querySelectorAll(
        '.section-label, .page-header h1, .page-header .tagline, .header-rule, .masonry-item'
      )];
      els.forEach(el => el.classList.add('reveal'));

      document.querySelectorAll('.masonry-grid').forEach(parent => {
        parent.querySelectorAll('.masonry-item').forEach((el, i) => {
          el.style.transitionDelay = `${(i % 3) * 0.1}s`;
        });
      });

      const io = new IntersectionObserver(entries => {
        entries.forEach(e => {
          if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); }
        });
      }, { threshold: 0.08 });

      els.forEach(el => io.observe(el));
    }());
  </script>

  <button class="scroll-top" id="scrollTop" aria-label="Back to top">
    <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="18 15 12 9 6 15"/>
    </svg>
  </button>

  <script>
    // ── Scroll to top ──
    (function () {
      const btn = document.getElementById('scrollTop');
      window.addEventListener('scroll', () => {
        btn.classList.toggle('visible', window.scrollY > 400);
      }, { passive: true });
      btn.addEventListener('click', () => {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      });
    }());
  </script>

</body>
</html>
